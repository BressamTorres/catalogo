services:
  catalogo-app:
    container_name: catalogo-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./:/var/www/html
    depends_on:
      - redis
    networks:
      - catalogo-network

  nginx:
    container_name: catalogo-nginx
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalogo-app
    networks:
      - catalogo-network

  redis:
    container_name: catalogo-redis
    image: redis:7-alpine
    networks:
      - catalogo-network

networks:
  catalogo-network:
    driver: bridge
